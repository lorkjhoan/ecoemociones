<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>EcoEmociones</title>
  <style>
    body {
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      background: #f0f9f9;
      margin-top: 50px;
    }

    h1 {
      color: #2a7f7f;
      font-size: 2.2em;
    }

    .btn-container {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    button {
      background-color: #4ac7b7;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #3bb09f;
      transform: scale(1.05);
    }

    footer {
      margin-top: 60px;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <h1>EcoEmociones 🐾</h1>
  <p>Elige un minijuego para comenzar:</p>

  <div class="btn-container">
    <button onclick="location.href='/mimica'">🎭 Mímica emocional</button>
    <button onclick="location.href='/interactuar'">😺 Interactuar con la mascota</button>
  </div>

  <footer>
    <p>Proyecto desarrollado con inteligencia artificial y amor por el bienestar 💚</p>
  </footer>
</body>
</html>
