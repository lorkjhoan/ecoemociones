<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>EcoEmociones - Mímica</title>
  <style>
    body {
      background-color: #e7f8f2;
      font-family: "Comic Sans MS", sans-serif;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin-top: 10px;
      color: #2b7a78;
    }

    #video-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    video {
      width: 850px;   /* Más ancho */
      height: 380px;  /* Mantener altura */
      border-radius: 15px;
      border: 4px solid #3aafa9;
      background: #fff;
    }

    #emotion {
      font-size: 1.4em;
      margin-top: 20px;
      color: #17252a;
    }

    #mascota {
      position: absolute;
      bottom: 10px;            /* Parte inferior del video */
      left: 50%;               /* Centrado horizontal */
      transform: translateX(-50%);
      width: 130px;             /* Mascota más grande */
      height: 130px;
      transition: transform 0.5s ease-in-out;
      pointer-events: none;
    }

    button {
      background-color: #3aafa9;
      border: none;
      color: white;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }

    button:hover {
      background-color: #2b7a78;
    }
  </style>
</head>
<body>
  <h1>EcoEmociones 🐾 - Mímica</h1>

  <div id="video-container">
    <video id="video" autoplay></video>
    <!-- Mascota centrada en la parte inferior del video -->
    <img id="mascota" src="/static/mascota/feliz.png" alt="Mascota" />
  </div>

  <p id="emotion">Detectando emoción...</p>

  <button onclick="window.location.href='/'">Volver al inicio</button>

  <script>
    const video = document.getElementById('video');
    const emotionText = document.getElementById('emotion');
    const mascotaImg = document.getElementById('mascota');

    const emocionesMascota = {
      feliz: '/static/mascota/feliz.png',
      triste: '/static/mascota/triste.png',
      enojado: '/static/mascota/enojado.png',
      sorprendido: '/static/mascota/sorprendido.png',
      asustado: '/static/mascota/asustado.png'
    };

    // Tiempo de espera entre una predicción y la siguiente (en milisegundos)
    const INTERVALO_MS = 1500;

    // Cantidad de predicciones recientes que se usan para suavizar el resultado
    const VENTANA = 5;

    // Últimas emociones detectadas con status "ok" (la más reciente va al final)
    let historial = [];

    // Emoción que la mascota está mostrando en este momento
    // (empieza en "feliz" porque esa es la imagen inicial del HTML)
    let emocionMostrada = 'feliz';

    // Devuelve la emoción que más se repite en la lista.
    // Si hay empate, gana la más reciente entre las empatadas.
    function emocionMasFrecuente(lista) {
      const conteo = {};
      for (const e of lista) {
        conteo[e] = (conteo[e] || 0) + 1;
      }
      const maximo = Math.max(...Object.values(conteo));

      // Recorrer desde el final: la primera con el conteo máximo es la más reciente
      for (let i = lista.length - 1; i >= 0; i--) {
        if (conteo[lista[i]] === maximo) return lista[i];
      }
      return null;
    }

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      video.srcObject = stream;
    });

    // Ciclo de predicción: la siguiente petición se programa solo cuando
    // termina la anterior, así nunca se acumulan peticiones al servidor
    async function ciclo() {
      // No enviar imágenes mientras la cámara aún no carga
      if (!video.videoWidth) {
        setTimeout(ciclo, INTERVALO_MS);
        return;
      }

      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const dataUrl = canvas.toDataURL('image/jpeg');
        const base64Data = dataUrl.split(',')[1];

        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Data })
        });

        const result = await res.json();
        const emotion = result.emotion;

        // Sin rostro: la persona se fue o tapó la cámara, se reinicia el historial
        if (result.status === "sin_rostro") {
          historial = [];
          emotionText.innerText = "No veo tu cara 👀 Acércate a la cámara";
          return;
        }

        // Resultado dudoso: pedir un gesto más claro, sin tocar el historial ni la mascota
        if (result.status === "dudoso") {
          emotionText.innerText = "Mmm... no estoy seguro 🤔 Exagera un poco más el gesto";
          return;
        }

        // Cualquier otra respuesta (por ejemplo, un error): no hacer nada
        if (result.status !== "ok") return;

        // Guardar la emoción y conservar solo las últimas VENTANA
        historial.push(emotion);
        if (historial.length > VENTANA) historial.shift();

        // Mostrar la emoción más frecuente, con el porcentaje de la predicción actual
        const emocionSuavizada = emocionMasFrecuente(historial);
        const porcentaje = Math.round(result.confidence * 100);
        // Mostrar el porcentaje solo si corresponde a la emoción que se está mostrando
        emotionText.innerText = emotion === emocionSuavizada
          ? `Emoción detectada: ${emocionSuavizada} (${porcentaje}%)`
          : `Emoción detectada: ${emocionSuavizada}`;

        // Cambiar la mascota solo si la emoción es distinta a la que ya muestra
        if (emocionSuavizada !== emocionMostrada && emocionesMascota[emocionSuavizada]) {
          emocionMostrada = emocionSuavizada;
          mascotaImg.src = emocionesMascota[emocionSuavizada];
          mascotaImg.style.transform = "translateX(-50%) scale(1.05)";
          setTimeout(() => mascotaImg.style.transform = "translateX(-50%) scale(1)", 300);
        }
      } catch (error) {
        console.error("Error en la predicción:", error);
      } finally {
        // Programar la siguiente ejecución cuando esta haya terminado
        setTimeout(ciclo, INTERVALO_MS);
      }
    }

    // Arrancar el ciclo una sola vez
    ciclo();
  </script>
</body>
</html>
