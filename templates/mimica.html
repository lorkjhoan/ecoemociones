<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>EcoEmociones - Mímica</title>
  <style>
    body {
      background-color: #e7f8f2;
      font-family: "Comic Sans MS", sans-serif;
      text-align: center;
      margin: 0;
      overflow: hidden;
    }

    h1 {
      margin-top: 10px;
      color: #2b7a78;
    }

    #video-container {
      position: relative;
      display: inline-block;
      margin-top: 20px;
    }

    video {
      width: 850px;   /* Más ancho */
      height: 380px;  /* Mantener altura */
      border-radius: 15px;
      border: 4px solid #3aafa9;
      background: #fff;
    }

    #emotion {
      font-size: 1.4em;
      margin-top: 20px;
      color: #17252a;
    }

    #mascota {
      position: absolute;
      bottom: 10px;            /* Parte inferior del video */
      left: 50%;               /* Centrado horizontal */
      transform: translateX(-50%);
      width: 130px;             /* Mascota más grande */
      height: 130px;
      transition: transform 0.5s ease-in-out;
      pointer-events: none;
    }

    button {
      background-color: #3aafa9;
      border: none;
      color: white;
      padding: 10px 20px;
      margin-top: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1em;
    }

    button:hover {
      background-color: #2b7a78;
    }
  </style>
</head>
<body>
  <h1>EcoEmociones 🐾 - Mímica</h1>

  <div id="video-container">
    <video id="video" autoplay></video>
    <!-- Mascota centrada en la parte inferior del video -->
    <img id="mascota" src="/static/mascota/feliz.png" alt="Mascota" />
  </div>

  <p id="emotion">Detectando emoción...</p>

  <button onclick="window.location.href='/'">Volver al inicio</button>

  <script>
    const video = document.getElementById('video');
    const emotionText = document.getElementById('emotion');
    const mascotaImg = document.getElementById('mascota');

    const emocionesMascota = {
      feliz: '/static/mascota/feliz.png',
      triste: '/static/mascota/triste.png',
      enojado: '/static/mascota/enojado.png',
      sorprendido: '/static/mascota/sorprendido.png',
      asustado: '/static/mascota/asustado.png'
    };

    navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
      video.srcObject = stream;
    });

    setInterval(async () => {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0);
      const dataUrl = canvas.toDataURL('image/jpeg');
      const base64Data = dataUrl.split(',')[1];

      try {
        const res = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: base64Data })
        });

        const result = await res.json();
        const emotion = result.emotion;

        emotionText.innerText = "Emoción detectada: " + emotion;

        if (emocionesMascota[emotion]) {
          mascotaImg.src = emocionesMascota[emotion];
          mascotaImg.style.transform = "translateX(-50%) scale(1.05)";
          setTimeout(() => mascotaImg.style.transform = "translateX(-50%) scale(1)", 300);
        }
      } catch (error) {
        console.error("Error en la predicción:", error);
      }
    }, 1500);
  </script>
</body>
</html>
